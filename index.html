<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard">

        <div class="logo">👤 Мой кабинет</div>

            <button class="btn">Сохранить</button>
