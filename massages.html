<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сообщения</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo">👤 Мой кабинет</div>
        <nav>
            <a href="index.html">Профиль</a>
            <a href="messages.html" class="active">Сообщения</a>

        <h1 class="page-title">Сообщения</h1>

                    <strong>Петров П.:</strong> Красавчик! Скинь потом на гитхаб
                    <span class="msg-meta">10:07</span>
                </div>

            <form class="send-form">
                <textarea placeholder="Введите сообщение..." rows="2" required></textarea>
                <button type="submit" class="btn">Отправить</button>
            </form>
        </div>
    </main>
</div>
